server {
    listen 80;
    server_name _;
    client_max_body_size 50m;   # 音声アップロードを許可

    # 静的な確認ページ (更新が即反映されるようキャッシュ無効)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-store" always;
    }

    # VOICEVOX (コンテナ) を同一オリジンでプロキシ → ブラウザから CORS なしで叩ける
    location /voicevox/ {
        proxy_pass http://voicevox:50021/;
        # VOICEVOX は cors_policy_mode=localhost が既定で、Origin が localhost 以外だと
        # 403 "Origin not allowed" を返す。サーバ間プロキシなので Origin を落として通す。
        proxy_set_header Origin "";
    }

    # Whisper (ホストの whisper-server) を同一オリジンでプロキシ
    location /whisper/ {
        proxy_pass http://host.docker.internal:9000/;
        proxy_read_timeout 120s;
    }
}
