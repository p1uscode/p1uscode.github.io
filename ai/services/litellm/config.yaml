model_list:
  # Ollama
  # think / keep_alive は Ollama native の root パラメータ。LiteLLM はそのまま
  # 転送するので、ここで既定を持たせるとクライアント側の実装に依らず
  # 「思考トークン無効 + モデル常駐 24h」で揃う (リクエストで上書き可能)
  - model_name: "ollama/qwen3.8:27b-mlx"
    litellm_params:
      model: "ollama_chat/qwen3.8:27b-mlx"
      api_base: os.environ/OLLAMA_BASE_URL
      think: false
      keep_alive: "24h"

  - model_name: "ollama/qwen3.6:35b-a3b"
    litellm_params:
      model: "ollama_chat/qwen3.6:35b-a3b"
      api_base: os.environ/OLLAMA_BASE_URL
      think: false
      keep_alive: "24h"

  - model_name: "ollama/qwen3.5:9b"
    litellm_params:
      model: "ollama_chat/qwen3.5:9b"
      api_base: os.environ/OLLAMA_BASE_URL
      think: false
      keep_alive: "24h"
  - model_name: "ollama/qwen3.5:0.8b"
    litellm_params:
      model: "ollama_chat/qwen3.5:0.8b"
      api_base: os.environ/OLLAMA_BASE_URL
      think: false
      keep_alive: "24h"

  - model_name: "ollama/gemma4:31b"
    litellm_params:
      model: "ollama_chat/gemma4:31b"
      api_base: os.environ/OLLAMA_BASE_URL
      keep_alive: "24h"
  - model_name: "ollama/gemma4:e4b"
    litellm_params:
      model: "ollama_chat/gemma4:e4b"
      api_base: os.environ/OLLAMA_BASE_URL
      keep_alive: "24h"

  # 疎通確認用の極小モデル。capabilities は completion のみで tools / vision は
  # 持たないため、エージェント用途には使えない
  - model_name: "ollama/gemma3:270m"
    litellm_params:
      model: "ollama_chat/gemma3:270m"
      api_base: os.environ/OLLAMA_BASE_URL
      keep_alive: "24h"

  # wildcard で pull 済みの任意モデルを `ollama/<tag>` として呼び出せる
  # 例: `ollama/qwen3.5:9b`, `ollama/qwen3.6:35b-a3b`
  # ただし `x/z-image-turbo` のような画像生成モデルは chat completions の
  # 形に乗らないので、ここを通しても呼べない (Ollama に直接投げる)
  - model_name: "ollama/*"
    litellm_params:
      model: "ollama_chat/*"
      api_base: os.environ/OLLAMA_BASE_URL
      think: false
      keep_alive: "24h"

  # OpenAI
  - model_name: gpt-5.5
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-5.4-mini
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-5.4-nano
    litellm_params:
      model: openai/gpt-5.4-nano
      api_key: os.environ/OPENAI_API_KEY

  # Anthropic
  - model_name: claude-opus-4-8
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # Google Gemini
  - model_name: gemini-3.1-pro-preview
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3.1-flash-preview
    litellm_params:
      model: gemini/gemini-3.1-flash-preview
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3.1-flash-lite-preview
    litellm_params:
      model: gemini/gemini-3.1-flash-lite-preview
      api_key: os.environ/GEMINI_API_KEY

  # 2.5 系は 3.1 のフォールバック先として残す
  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

general_settings:
  pass_through_endpoints:
    - path: "/api"
      target: "http://host.docker.internal:11434/api"
      include_subpath: true

litellm_settings:
  drop_params: true
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  num_retries: 2
  request_timeout: 600
  # Open WebUI / Dify 等のクライアントからの metadata を Langfuse trace に転送
  langfuse_default_tags:
    - "caller_name"
    - "user_api_key_alias"
    - "user_api_key_user_id"
    - "user_api_key_team_alias"
    - "semantic-similarity"
    - "proxy_base_url"

router_settings:
  # 429 (rate limit) や一時エラー時のフォールバック連鎖 (同一プロバイダ内で完結させる)
  fallbacks:
    - claude-opus-4-8: ["claude-sonnet-4-6", "claude-haiku-4-5"]
    - claude-sonnet-4-6: ["claude-haiku-4-5"]
    - gpt-5.5: ["gpt-5.4-mini", "gpt-5.4-nano"]
    - gpt-5.4-mini: ["gpt-5.4-nano"]
    - gemini-3.1-pro-preview: ["gemini-3.1-flash-preview", "gemini-2.5-pro"]
    - gemini-3.1-flash-preview: ["gemini-3.1-flash-lite-preview", "gemini-2.5-flash"]
    - gemini-3.1-flash-lite-preview: ["gemini-2.5-flash"]
    - gemini-2.5-pro: ["gemini-2.5-flash"]
