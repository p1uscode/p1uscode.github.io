http:
  routers:
    # 機器用入口は端末設定の取得・更新と利用量表示だけを HTTP 側へ通す。
    # 管理 API は agent-ui.home.arpa 側に限定する。
    agent-api:
      rule: "Host(`agent.home.arpa`) && ((PathRegexp(`^/api/device/[0-9a-f]{4,32}$`) && (Method(`GET`) || Method(`PATCH`))) || (Path(`/api/usage`) && Method(`GET`)))"
      entryPoints:
        - web
      service: agent-http

    # 機器の常時接続はルートの WebSocket Upgrade だけを許可する。
    # その他の URL はルーターに一致せず Traefik が 404 を返す。
    agent-ws:
      rule: "Host(`agent.home.arpa`) && Path(`/`) && Method(`GET`) && HeaderRegexp(`Upgrade`, `(?i)^websocket$`)"
      entryPoints:
        - web
      service: agent-ws

    # ブラウザ用の設定 UI。同じ :8099 だが Host で分ける(ws と / が衝突するため)。
    agent-ui:
      rule: "Host(`agent-ui.home.arpa`)"
      entryPoints:
        - web
      service: agent-http

    # 外向け webhook 専用の口(:8100)。UI/API とはポートで分けてある。
    agent-webhook:
      rule: "Host(`agent-webhook.home.arpa`)"
      entryPoints:
        - web
      service: agent-webhook

    # MCP ツールサーバ(:8097)。
    agent-mcp:
      rule: "Host(`agent-mcp.home.arpa`)"
      entryPoints:
        - web
      service: agent-mcp

  services:
    # ロボットの向き先をここ一箇所に集約する。Mac(.8)から red へ移すときは
    # この url を http://host-relay:PORT に変えるだけで、焼き直しは要らない。
    agent-ws:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: "http://host-relay:8098"

    agent-http:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: "http://host-relay:8099"

    agent-webhook:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: "http://host-relay:8100"

    agent-mcp:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: "http://host-relay:8097"
