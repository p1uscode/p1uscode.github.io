<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>p1uscode — AI Agent Digest Animation (capture mode)</title>

<script>
  // Deterministic capture mode: replace requestAnimationFrame with a queue
  // that only fires when the host calls window.__driveFrame(ts). This lets
  // Playwright step through the Stage timeline one frame at a time, with
  // exact timestamps, instead of relying on real-time playback.
  (() => {
    const pending = [];
    let nextId = 1;
    const cancelled = new Set();

    window.requestAnimationFrame = (cb) => {
      const id = nextId++;
      pending.push({ id, cb });
      return id;
    };
    window.cancelAnimationFrame = (id) => {
      cancelled.add(id);
    };

    window.__driveFrame = (ts) => {
      const batch = pending.splice(0);
      for (const { id, cb } of batch) {
        if (cancelled.has(id)) continue;
        try { cb(ts); } catch (e) { console.error('rAF cb threw:', e); }
      }
    };

    // Force any localStorage-persisted playhead to 0 so capture always
    // starts at the beginning regardless of prior browsing.
    try { localStorage.setItem('digest-anim:t', '0'); } catch {}
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    color: #e8e8e6;
  }
  #root { position: absolute; inset: 0; }
  /* Hide the Stage playback bar — keep only the canvas for clean capture. */
  [data-anim-root] > div > div:not(:first-child) { display: none !important; }
</style>
</head>
