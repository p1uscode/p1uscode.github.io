[tools]
jq = "1.8.2"

[env]
_.file = ".env"

[tasks.clone]
description = "Clone dify repository at the pinned tag"
run = """
#!/usr/bin/env bash
set -e
if [ -d "services/dify/dify/.git" ]; then
  echo "dify: already cloned, fetching tag ${DIFY_TAG}"
  git -C services/dify/dify fetch --tags origin
  git -C services/dify/dify checkout "${DIFY_TAG}"
else
  git clone --depth 1 --branch "${DIFY_TAG}" https://github.com/langgenius/dify.git services/dify/dify
fi
"""

[tasks.setup]
description = "Initial setup: clone repos and create docker network"
depends = ["clone"]
run = "docker network create proxy 2>/dev/null || true"

# ── up ────────────────────────────────────────────────────────────

[tasks."up:traefik"]
description = "Start traefik"
run = "docker compose -f services/traefik/docker-compose.yml up -d"

[tasks."up:host-relay"]
description = "Start host-relay (Traefik → ホスト常駐サービスの TCP 中継)"
run = "docker compose -f services/host-relay/docker-compose.yml up -d"

[tasks."up:dify"]
description = "Start dify"
run = """
docker compose -p dify \
  -f services/dify/dify/docker/docker-compose.yaml \
  -f services/dify/docker-compose.override.yaml \
  up -d
"""

[tasks."up:litellm"]
description = "Start litellm"
run = "docker compose -f services/litellm/docker-compose.yml up -d"

[tasks."up:open-webui"]
description = "Start open-webui"
run = "docker compose -f services/open-webui/docker-compose.yml up -d"

[tasks."up:langfuse"]
description = "Start langfuse (LLM observability)"
run = "docker compose -f services/langfuse/docker-compose.yml up -d"

[tasks."up:searxng"]
description = "Start searxng (metasearch engine)"
run = "docker compose -f services/searxng/docker-compose.yml up -d"

[tasks."up:qdrant"]
description = "Start qdrant (vector DB)"
run = "docker compose -f services/qdrant/docker-compose.yml up -d"

[tasks."up:n8n"]
description = "Start n8n (workflow automation)"
run = "docker compose -f services/n8n/docker-compose.yml up -d"

[tasks."up:homepage"]
description = "Start homepage (service dashboard)"
run = "docker compose -f services/homepage/docker-compose.yml up -d"

[tasks."up:voicevox"]
description = "Start voicevox (TTS engine)"
run = "docker compose -f services/voicevox/docker-compose.yml up -d"

[tasks."up:voice-check"]
description = "Start voice-check (VOICEVOX/Whisper 疎通確認 UI)"
run = "docker compose -f services/voice-check/docker-compose.yml up -d"

[tasks.up]
description = "Start core services (dify / langfuse / n8n は含めない。必要な時に up:dify / up:langfuse / up:n8n で個別起動)"
depends = [
  "up:traefik",
  "up:host-relay",
  "up:litellm",
  "up:open-webui",
  "up:searxng",
  "up:qdrant",
  "up:homepage",
  "up:voicevox",
  "up:voice-check",
]

# ── down ──────────────────────────────────────────────────────────

[tasks."down:traefik"]
description = "Stop traefik"
run = "docker compose -f services/traefik/docker-compose.yml down"

[tasks."down:host-relay"]
description = "Stop host-relay"
run = "docker compose -f services/host-relay/docker-compose.yml down"

[tasks."down:dify"]
description = "Stop dify"
run = """
docker compose -p dify \
  -f services/dify/dify/docker/docker-compose.yaml \
  -f services/dify/docker-compose.override.yaml \
  down
"""

[tasks."down:litellm"]
description = "Stop litellm"
run = "docker compose -f services/litellm/docker-compose.yml down"

[tasks."down:open-webui"]
description = "Stop open-webui"
run = "docker compose -f services/open-webui/docker-compose.yml down"

[tasks."down:langfuse"]
description = "Stop langfuse"
run = "docker compose -f services/langfuse/docker-compose.yml down"

[tasks."down:searxng"]
description = "Stop searxng"
run = "docker compose -f services/searxng/docker-compose.yml down"

[tasks."down:qdrant"]
description = "Stop qdrant"
run = "docker compose -f services/qdrant/docker-compose.yml down"

[tasks."down:n8n"]
description = "Stop n8n"
run = "docker compose -f services/n8n/docker-compose.yml down"

[tasks."down:homepage"]
description = "Stop homepage"
run = "docker compose -f services/homepage/docker-compose.yml down"

[tasks."down:voicevox"]
description = "Stop voicevox"
run = "docker compose -f services/voicevox/docker-compose.yml down"

[tasks."down:voice-check"]
description = "Stop voice-check"
run = "docker compose -f services/voice-check/docker-compose.yml down"

[tasks.down]
description = "Stop all services"
depends = [
  "down:traefik",
  "down:host-relay",
  "down:dify",
  "down:litellm",
  "down:open-webui",
  "down:langfuse",
  "down:searxng",
  "down:qdrant",
  "down:n8n",
  "down:homepage",
  "down:voicevox",
  "down:voice-check",
]

# ── update ────────────────────────────────────────────────────────

[tasks."update:dify"]
description = "Pull dify images for the pinned tag (bump DIFY_TAG in tasks.clone to upgrade)"
run = """
#!/usr/bin/env bash
set -e
docker compose -p dify \
  -f services/dify/dify/docker/docker-compose.yaml \
  -f services/dify/docker-compose.override.yaml \
  pull
"""

[tasks.update]
description = "Pull latest images for all services"
run = """
#!/usr/bin/env bash
docker compose -f services/traefik/docker-compose.yml pull
docker compose -f services/litellm/docker-compose.yml pull
docker compose -f services/open-webui/docker-compose.yml pull
docker compose -f services/langfuse/docker-compose.yml pull
docker compose -f services/searxng/docker-compose.yml pull
docker compose -f services/qdrant/docker-compose.yml pull
docker compose -f services/n8n/docker-compose.yml pull
docker compose -f services/homepage/docker-compose.yml pull
docker compose -f services/voicevox/docker-compose.yml pull
docker compose -f services/voice-check/docker-compose.yml pull
"""

# ── whisper (host / STT) ──────────────────────────────────────────
# Ollama と同じく Metal GPU を使うためコンテナ化せずホストに常駐させる。
# brew install whisper-cpp ffmpeg が前提 (詳細は docs/setup/whisper.md)。

[tasks."whisper:model"]
description = "Download whisper ggml models (small + large-v3-turbo-q5_0)"
run = """
#!/usr/bin/env bash
set -e
MD=services/whisper/models
mkdir -p "$MD"
base=https://huggingface.co/ggerganov/whisper.cpp/resolve/main
for m in ggml-small.bin ggml-large-v3-turbo-q5_0.bin; do
  if [ -f "$MD/$m" ]; then echo "$m: already present"; else
    echo "downloading $m ..."; curl -fL -o "$MD/$m" "$base/$m"; fi
done
ls -lh "$MD"
"""

[tasks."whisper:serve"]
description = "Run whisper.cpp server on host (0.0.0.0:${WHISPER_PORT}, Metal). Exposed via whisper.home.arpa"
run = "whisper-server -m ${WHISPER_MODEL} --host 0.0.0.0 --port ${WHISPER_PORT} -l ${WHISPER_LANG} --convert"

# ── mlx-lm (host / LLM) ───────────────────────────────────────────
# Ollama と同じく Metal GPU を直接使うためホスト実行。Ollama との
# スループット比較用 (詳細は docs/setup/mlx-lm.md)。

[tasks."mlx:model"]
description = "Download the MLX model weights from Hugging Face (~15GB)"
dir = "services/mlx-lm"
run = """
uv run --quiet python -c "
from huggingface_hub import snapshot_download
print(snapshot_download('${MLX_MODEL}', max_workers=8))
"
"""

[tasks."mlx:bench"]
description = "Benchmark ollama vs mlx-lm on the same model (prefill / decode tok/s)"
dir = "services/mlx-lm"
run = "uv run --quiet python bench.py --ollama-model ${MLX_OLLAMA_MODEL} --mlx-model ${MLX_MODEL}"

[tasks."mlx:serve"]
description = "Run the mlx-lm OpenAI-compatible server on host (0.0.0.0:${MLX_PORT})"
dir = "services/mlx-lm"
run = "uv run --quiet mlx_lm.server --model ${MLX_MODEL} --host 0.0.0.0 --port ${MLX_PORT}"

# ── agent-demo ────────────────────────────────────────────────────

[tasks."agent-single"]
description = "Run the LangChain agent demo (single-shot; pass prompt as args after --)"
dir = "examples/agent-demo"
run = "mise exec -- npm run agent-single --"

[tasks."agent-chat"]
description = "Run the LangChain agent demo in interactive chat mode"
dir = "examples/agent-demo"
run = "mise exec -- npm run agent-chat"

[tasks."agent:ci"]
description = "Install agent-demo dependencies from lockfile (reproducible)"
dir = "examples/agent-demo"
run = "mise exec -- npm ci"

[tasks."agent:install"]
description = "Install agent-demo dependencies (updates lockfile; use for adding/updating deps)"
dir = "examples/agent-demo"
run = "mise exec -- npm install"
